name: Windows Build

on:
  push:
    branches:
      - main
      - feat/*
      - fix/*
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    name: Build & Package Windows Application
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git init .
          git remote add origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git fetch --depth 1 origin ${{ github.sha }}
          git checkout FETCH_HEAD

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend (TypeScript & Vite)
        run: npm run build

      - name: Setup Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-release-v4-joren-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'src-tauri/build.rs') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-v4-joren-${{ hashFiles('src-tauri/Cargo.lock') }}-
            ${{ runner.os }}-cargo-release-v4-joren-

      - name: Cache CEF binary distribution
        id: cache-cef
        uses: actions/cache@v4
        with:
          path: cef-dist
          key: cef-windows64-156.0.15-v1

      - name: Download & Extract CEF Distribution (if cache missed)
        if: steps.cache-cef.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path cef-dist | Out-Null
          $url = "https://cef-builds.spotifycdn.com/cef_binary_156.0.15%2Bgcf671c0%2Bchromium-156.0.8078.80_windows64.tar.bz2"
          Write-Host "Downloading CEF distribution: $url"
          curl.exe -sSL --retry 3 --retry-delay 5 $url -o cef_archive.tar.bz2
          Write-Host "Extracting CEF distribution..."
          tar.exe -xjf cef_archive.tar.bz2 -C cef-dist --strip-components=1
          Remove-Item -Force cef_archive.tar.bz2
          Write-Host "CEF distribution successfully cached."

      - name: Build Sandboxed Joren Client Library (Release)
        shell: pwsh
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml 2>&1 | Tee-Object -FilePath "cargo-build.log"
          if ($LASTEXITCODE -ne 0) {
            $summary = Get-Content "cargo-build.log" -Tail 60 | Out-String
            Write-Host "::error::Cargo release build failed:`n$summary"
            exit 1
          }

      - name: Stage Release Package & Runtime Files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging\joren\app | Out-Null
          New-Item -ItemType Directory -Force -Path staging\joren\locales | Out-Null

          # 1. Official CEF Sandbox Bootstrap executable -> joren.exe
          $bootstrapExe = "cef-dist\Release\bootstrap.exe"
          if (Test-Path $bootstrapExe) {
              Copy-Item $bootstrapExe -Destination "staging\joren\joren.exe"
              Write-Host "Staged sandbox bootstrap executable as joren.exe"
          } else {
              # Fallback to bootstrapc.exe or client executable if present
              $bootstrapc = "cef-dist\Release\bootstrapc.exe"
              if (Test-Path $bootstrapc) {
                  Copy-Item $bootstrapc -Destination "staging\joren\joren.exe"
              } else {
                  Write-Error "Bootstrap executable not found in cef-dist\Release\"
                  exit 1
              }
          }

          # 2. Rust client DLL (joren.dll)
          $jorenDll = "src-tauri\target\release\joren.dll"
          if (Test-Path $jorenDll) {
              Copy-Item $jorenDll -Destination "staging\joren\joren.dll"
              Write-Host "Staged Rust client library: joren.dll"
          } else {
              Write-Error "joren.dll not found in src-tauri\target\release\"
              exit 1
          }

          # 3. CEF runtime binaries and resources
          Copy-Item "cef-dist\Release\*.dll" -Destination "staging\joren\" -Force
          Copy-Item "cef-dist\Release\*.bin" -Destination "staging\joren\" -Force
          Copy-Item "cef-dist\Resources\*.*" -Destination "staging\joren\" -Force
          Copy-Item "cef-dist\Resources\locales\*.*" -Destination "staging\joren\locales\" -Force

          # 4. Stage MSVC Runtime CRT DLLs
          $crtDirs = Get-ChildItem "C:\Program Files*\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -ErrorAction SilentlyContinue
          if ($crtDirs) {
              $crtDir = $crtDirs | Select-Object -First 1 -ExpandProperty FullName
              Write-Host "Found MSVC CRT directory: $crtDir"
              Copy-Item "$crtDir\*.dll" -Destination "staging\joren\" -Force
          } else {
              Write-Host "Searching system for MSVC CRT DLLs..."
              $crtFiles = @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll")
              foreach ($f in $crtFiles) {
                  $found = (Get-ChildItem "C:\Program Files*" -Recurse -Filter $f -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
                  if ($found) {
                      Copy-Item $found -Destination "staging\joren\" -Force
                      Write-Host "Staged CRT $f from $found"
                  }
              }
          }

          # 5. Bundled frontend React build
          New-Item -ItemType Directory -Path "staging\joren\app" -Force | Out-Null
          Copy-Item -Recurse -Force "build\*" -Destination "staging\joren\app\"
          Write-Host "Staged React frontend build to app/"
          Get-ChildItem -Recurse "staging\joren\app" | Select-Object Name, Length

          # 6. Local LLM assets (preserved)
          if (Test-Path "Llama") {
              Copy-Item -Recurse -Force "Llama" -Destination "staging\joren\Llama"
              Write-Host "Preserved and staged Llama local LLM assets"
          }

          # 7. License
          if (Test-Path "LICENSE") {
              Copy-Item "LICENSE" -Destination "staging\joren\LICENSE"
          }

          Write-Host "Package staging complete. File count: $((Get-ChildItem -Recurse staging\joren).Count)"

      - name: Run Sandboxed Native Launch Smoke Test
        shell: pwsh
        run: |
          Write-Host "Starting sandboxed native launch smoke test on staged executable..."
          $stagingDir = (Resolve-Path "staging\joren").Path
          $exePath = Join-Path $stagingDir "joren.exe"
          $stdoutLog = Join-Path $PWD "smoke_stdout.log"
          $stderrLog = Join-Path $PWD "smoke_stderr.log"

          $proc = Start-Process -FilePath $exePath `
            -ArgumentList "--smoke-test" `
            -WorkingDirectory $stagingDir `
            -RedirectStandardOutput $stdoutLog `
            -RedirectStandardError $stderrLog `
            -PassThru -Wait

          Write-Host "Smoke test process exit code: $($proc.ExitCode)"
          if (Test-Path $stdoutLog) {
              Write-Host "=== smoke_stdout.log ==="
              Get-Content $stdoutLog
          }
          if (Test-Path $stderrLog) {
              Write-Host "=== smoke_stderr.log ==="
              Get-Content $stderrLog
          }
          if (Test-Path "$env:APPDATA\Joren\logs\startup.log") {
              Write-Host "=== startup.log ==="
              Get-Content "$env:APPDATA\Joren\logs\startup.log"
          }
          if (Test-Path "$env:APPDATA\Joren\logs\cef.log") {
              Write-Host "=== cef.log ==="
              Get-Content "$env:APPDATA\Joren\logs\cef.log"
          }
          if (Test-Path "staging\joren\debug.log") {
              Write-Host "=== staging\joren\debug.log ==="
              Get-Content "staging\joren\debug.log"
          }

          if ($proc.ExitCode -ne 0) {
              Write-Error "Smoke test FAILED with exit code $($proc.ExitCode)"
              exit 1
          }
          Write-Host "Native smoke test PASSED cleanly with exit code 0."

      - name: Setup NSIS Compiler
        shell: pwsh
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
              if (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") {
                  "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              } else {
                  choco install nsis -y --no-progress
                  "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              }
          }

      - name: Build Portable Release ZIP & NSIS Installer
        shell: pwsh
        run: |
          # 1. Create portable ZIP containing complete runtime
          Compress-Archive -Path "staging\joren\*" -DestinationPath "staging\joren-windows-x64-portable.zip" -Force
          Write-Host "Created portable package: staging/joren-windows-x64-portable.zip"

          # 2. Compile NSIS installer
          $stagingAbs = (Resolve-Path "staging\joren").Path
          $outAbs = Join-Path (Resolve-Path "staging").Path "joren-setup-x64.exe"
          $nsiAbs = (Resolve-Path "src-tauri\installer.nsi").Path
          $iconAbs = (Resolve-Path "src-tauri\icons\icon.ico").Path

          $makensis = (Get-Command makensis.exe -ErrorAction SilentlyContinue)?.Source
          if (-not $makensis) {
              if (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") {
                  $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
              } elseif (Test-Path "C:\Program Files\NSIS\makensis.exe") {
                  $makensis = "C:\Program Files\NSIS\makensis.exe"
              } else {
                  choco install nsis -y --no-progress
                  $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
              }
          }

          Write-Host "Invoking makensis: $makensis"
          & $makensis /DPRODUCT_VERSION="0.1.0" "/DSTAGING_DIR=$stagingAbs" "/DOUTFILE=$outAbs" "/DICON_PATH=$iconAbs" "$nsiAbs"
          if ($LASTEXITCODE -ne 0) {
              Write-Error "makensis failed with exit code $LASTEXITCODE"
              exit $LASTEXITCODE
          }
          Write-Host "Compiled NSIS installer: staging/joren-setup-x64.exe"

      - name: Validate Portable Package Extraction & Runtime Smoke Test
        shell: pwsh
        run: |
          Write-Host "Extracting and testing portable ZIP package runtime..."
          $testExtractDir = Join-Path $PWD "staging\test-portable-extract"
          Expand-Archive -Path "staging\joren-windows-x64-portable.zip" -DestinationPath $testExtractDir -Force
          $portableExe = Join-Path $testExtractDir "joren.exe"
          $testOut = Join-Path $PWD "portable_smoke_stdout.log"
          $testErr = Join-Path $PWD "portable_smoke_stderr.log"

          $proc = Start-Process -FilePath $portableExe `
            -ArgumentList "--smoke-test" `
            -WorkingDirectory $testExtractDir `
            -RedirectStandardOutput $testOut `
            -RedirectStandardError $testErr `
            -PassThru -Wait

          Write-Host "Portable package smoke test exit code: $($proc.ExitCode)"
          if (Test-Path $testOut) {
              Write-Host "=== portable_smoke_stdout.log ==="
              Get-Content $testOut
          }
          if (Test-Path $testErr) {
              Write-Host "=== portable_smoke_stderr.log ==="
              Get-Content $testErr
          }
          if (Test-Path "$env:APPDATA\Joren\logs\startup.log") {
              Write-Host "=== startup.log ==="
              Get-Content "$env:APPDATA\Joren\logs\startup.log"
          }

          if ($proc.ExitCode -ne 0) {
              Write-Error "Portable package smoke test FAILED with exit code $($proc.ExitCode)"
              exit 1
          }
          Write-Host "Portable package smoke test PASSED cleanly with exit code 0."
          Remove-Item -Recurse -Force $testExtractDir

      - name: Generate Checksums
        shell: pwsh
        run: |
          # Generate SHA256 checksums
          Get-ChildItem -Path "staging" | Where-Object { $_.Extension -in '.zip', '.exe' } | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" } | Set-Content staging\SHA256.txt
          Write-Host "Generated SHA256 checksums:"
          Get-Content staging\SHA256.txt

      - name: Upload Windows Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: joren-windows-x64-build
          path: |
            staging/*.zip
            staging/*.exe
            staging/SHA256.txt
          retention-days: 14
          if-no-files-found: error

      - name: Collect Diagnostic Logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "diagnostic-logs" -Force | Out-Null
          if (Test-Path "$env:APPDATA\Joren\logs") {
              Copy-Item -Recurse -Force "$env:APPDATA\Joren\logs\*" -Destination "diagnostic-logs\"
          }
          if (Test-Path "staging\joren\*.log") {
              Copy-Item -Force "staging\joren\*.log" -Destination "diagnostic-logs\"
          }
          if (Test-Path "*.log") {
              Copy-Item -Force "*.log" -Destination "diagnostic-logs\"
          }

      - name: Upload Diagnostic Logs on Any Outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joren-diagnostic-logs
          path: diagnostic-logs/
          if-no-files-found: ignore
